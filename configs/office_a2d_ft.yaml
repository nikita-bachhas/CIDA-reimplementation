# Office A->D (Table 3 setting) with the ResNet-50 backbone NOT frozen: the whole network trains at
# Adam 1e-4 in both stages, the natural reading of the paper ("ResNet-50 pretrained on ImageNet",
# Adam 1e-4). Every other improvement of the main configuration stays on (AdaBN, residual fe/fd,
# linear fe/fd last layer, La1 on B_t, two-FC256 head). Isolates the effect of freezing: seed-paired
# with the main runs (same seed = same one-shot images), 70.3 / 48.5 / 93.4.
# Trains its own source model: writes runs/office_a2d_ft/source and runs/office_a2d_ft/adapt_1shot_abl-none_seed<k>.
base: office_a2d.yaml
name: office_a2d_ft
src_train: {backbone_lr_mult: 1.0}
adapt: {backbone_lr_mult: 1.0}
