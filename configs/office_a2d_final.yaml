# Final run, Table 3 setting (10 shared + 10 private) on A->D: the report's off-protocol configuration,
# as configs/office20_*_final.yaml (Table 2 setting) but with the Table 3 class split. Hand-picked one-shot dslr
# images (the Table 2 picks without trash_can, which Table 3 drops; not the paper's protocol), lp pseudo-labels,
# 20 adaptation epochs, ResNet-50 frozen. Source length is step-matched to the Table 2 final runs: 10 shared
# classes give amazon 25 source steps per epoch, so 340 epochs + 1 warm-up is ~8,525 steps (Table 2: Amazon
# ~8,450, Webcam ~2,880, DSLR ~2,850). Seeds 0-4 change only the training RNG.
# Trains its own source model: writes runs/office_a2d_final/source and
# runs/office_a2d_final/adapt_1shot_abl-none_final_seed<k>.
base: office_a2d.yaml
name: office_a2d_final
src_train: {epochs: 340, backbone_lr_mult: 0.0}
adapt:
  tag: final
  pseudo_label: lp
  epochs: 20
  backbone_lr_mult: 0.0
  fixed_shots:
    phone: frame_0002.jpg            # sharp 3/4 view: handset, display, keypad; plain dark desk
    printer: frame_0014.jpg          # boxy laser printer (most common model), 3/4, output tray; plain wall
    projector: frame_0014.jpg        # tabletop silver model (most common), lens front and centre
    punchers: frame_0003.jpg         # two-hole punch (most common), arch handle and paper guide
    ring_binder: frame_0007.jpg      # lever-arch binder, ring mechanism and spine visible
    ruler: frame_0007.jpg            # wooden ruler, sharp tick marks, plain background
    scissors: frame_0018.jpg         # blue scissors (most common), open, blades and handles visible
    speaker: frame_0011.jpg          # grille dominant (what separates it from desktop_computer), 3/4
    stapler: frame_0019.jpg          # black Swingline (most common), throat and anvil visible
    tape_dispenser: frame_0020.jpg   # rectangular black model (most common), roll and cutter visible
