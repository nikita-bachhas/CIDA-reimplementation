base: base.yaml
dataset: visda
domain_paths:
  synthetic: visda/train
  real: visda/validation
shared: [bicycle, bus, car, motorcycle, train, truck]      # [paper]
private: [aeroplane, horse, knife, person, plant, skateboard]
src_train_split: all
src_eval_split: all
tgt_train_split: all
tgt_eval_split: all
image_size: 224
batch_size: 32
model: {backbone: resnet50, pretrained: true, resnet_fc_out: 2, feat_dim: 256, cls_hidden: 64, act: elu, proj_layers: 3}
src_train: {epochs: 5}
adapt: {epochs: 10}
