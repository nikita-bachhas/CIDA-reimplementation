# Vanilla: the method exactly as the paper describes it, with none of our fixes.
#   sbatch slurm/run.sbatch configs/office_a2d.yaml preset=vanilla      -> runs_vanilla/office_a2d
# Where the paper says something, follow it. Where it is silent (batch size, epochs, covariance
# regularisation, data splits, ...) keep the same choices as the main runs; see SPEC.md "Vanilla preset".
model:
  proj_residual: false     # fe/fd: plain MLP pretrained to near-identity (Algo 4 lines 3-7), not u + MLP(u)
  proj_final_act: true     # fe/fd last layer with the activation listed in supp Table 2
src_train:
  neg_mode: paper          # supp Algo 1 3-sigma test
  backbone_lr_mult: 1.0    # whole network (incl. pretrained ResNet-50) trained with Adam 1e-4
adapt:
  la1_samples: all         # La1 on all target samples, x_t ~ q_X (Eq. 6, Algo 4)
  la1_temp: 1.0
  adabn: false             # ft <- fs as is, BatchNorm statistics included
  backbone_lr_mult: 1.0
