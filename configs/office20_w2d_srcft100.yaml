# Table 2 setting on W->D: does the source model hold PRIV back? Same adaptation as
# configs/office20_w2d_fixedshot_lp20.yaml (hand-picked DSLR one-shot images, lp pseudo-labels,
# 20 adaptation epochs, ResNet frozen during adaptation), but a new source model trained with the
# ResNet-50 backbone NOT frozen (Adam 1e-4 on the whole network) for 100 epochs + 1 warm-up, so that
# Ls1 and Ls2 have time to settle (Webcam gives only 16 source steps per epoch; the frozen 50-epoch
# source model ended with Ls2 2.17 and 38.9% of negatives detected). ft starts from this source model
# and its (fine-tuned) ResNet stays fixed during adaptation; only its BatchNorm statistics follow
# DSLR (AdaBN). Seed-paired with job 56686 (W->D, seeds 0-4). Not the paper's protocol: report
# separately from Table 2.
# Trains its own source model: writes runs/office20_w2d_srcft100/source and
# runs/office20_w2d_srcft100/adapt_1shot_abl-none_fixedshot_lp20_srcft100_seed<k>.
base: office20_w2d_fixedshot_lp20.yaml
name: office20_w2d_srcft100
src_train: {epochs: 100, backbone_lr_mult: 1.0}
adapt: {tag: fixedshot_lp20_srcft100, backbone_lr_mult: 0.0}
