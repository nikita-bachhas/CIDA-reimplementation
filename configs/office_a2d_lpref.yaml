# Office A->D (Table 3 setting) with label propagation as the pseudo-labeller at every refresh
# (adapt.pseudo_label=lp; SPEC.md, "Under test: lp pseudo-labels in training"). Random one-shot draws,
# so seed-paired with the main runs. Writes runs/office_a2d/adapt_1shot_abl-none_lpref_seed<k>,
# reusing runs/office_a2d/source.
#   sbatch --export=ALL,STAGES=adapt slurm/run.sbatch configs/office_a2d_lpref.yaml
base: office_a2d.yaml
adapt:
  tag: lpref
  pseudo_label: lp
