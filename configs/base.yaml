# Shared defaults. Paper-specified values are marked [paper]; everything else is our choice.
data_root: ./data
device: auto
num_workers: 4
batch_size: 64
lr: 1.0e-4                 # [paper] Adam, all optimisers
source_seed: 0
ckpt_every_minutes: 20     # intermediate checkpoints (6 h cluster limit)
keep_ckpt: false           # delete a run's resume checkpoint ckpt.pt once final.pt is written (saves disk)

src_train:
  warmup_epochs: 1         # [paper] 1 epoch vanilla CE before fitting prototypes
  epochs: 20
  neg_ratio: 1.0           # [paper] Nsrc = Nneg
  k_sigma: 3               # [paper] 3-sigma
  neg_mode: paper          # paper | chi2 (see SPEC.md)
  chi2_quantile: 0.997
  use_ls1: true            # ablation: class separability objective
  use_negatives: true      # ablation: negative training
  cov_shrink: 0.1          # covariance regularisation (not in paper)
  cov_eps: 1.0e-4

adapt:
  epochs: 20
  shots: 1                 # [paper] one-shot target-private samples
  fewshot_frac: null       # 0.05 for the few-shot (Ours*) setting
  fixed_shots: null        # {class name: file name} hand-picked one-shot images (not in the paper; SPEC.md)
  n_percent: 20            # [paper] confident samples per guide
  ablation: none           # none | a | b | c  (Ours-a/b/c) | nola1 (diagnostic)
  la1_samples: confident   # all (paper: x_t ~ q_X) | confident (draw La1 batches from B_t); see SPEC.md
  la1_temp: 1.0            # La1 logits = log-density / la1_temp (1.0 = paper)
  tag: null                # appended to the run folder name, e.g. la1conf
  adabn: true              # re-estimate ft's BatchNorm stats on the target first (see SPEC.md)
  proj_pretrain_iters: 2000
  max_guide_samples_per_class: 16
  cov_shrink: 0.1
  cov_eps: 1.0e-4
  iters_per_epoch: null    # default: len(target loader) * number of losses
  rectify:                 # guide rectification (not in the paper; see SPEC.md, cida/rectify.py)
    enabled: false
    eps: 10.0              # softmax sharpness of the cosine weights (large = keep the one-shot guide)
    anchor: 0.3            # minimum weight of the labelled image in its rectified guide
    iters: 3               # re-assign / re-average rounds per refresh
    select: distance       # distance (nearest members, as B_t) | margin (smallest d1/d2)
    shared: false          # also rectify the shared guides fe(mu_c) with their target members
